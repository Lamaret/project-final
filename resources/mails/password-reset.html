<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <title th:text="#{mail.reset.title}">JiraRush - установить новый пароль</title>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type"/>
</head>
<body>
<p th:text="#{mail.greeting} + ' ' + ${user.firstName} + '.'"></p>
<p th:text="#{mail.reset.body} + ' ' + ${user.email} + '.'"></p>
<a th:href="${resetUrl}" th:text="#{mail.reset.btn}">Установить пароль</a>
</body>
</html>
